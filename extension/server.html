<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Figma2AE (receptor)</title></head>
<body>
<script>
/* Receptor do Figma2AE: roda escondido desde que o After Effects abre.
   Recebe os pacotes do plugin do Figma, guarda em Documentos\Figma2AE\Recebidos e abre o painel. */
"use strict";
const { Buffer } = require("buffer");
const http = require("http"), fs = require("fs"), path = require("path"), os = require("os"), zlib = require("zlib");
const PORT = 7452;
const ROOT = path.join(os.homedir(), "Documents", "Figma2AE");
const BASE = path.join(ROOT, "Recebidos");
const STATE = path.join(BASE, "_estado.json");
const PANEL_ID = "com.iug.figma2ae.panel";
let hostOk = false, hostErr = "", project = "", lastStateWrite = 0, discord = { status: "parado" };

function evalAE(script) { return new Promise(res => { if (!window.__adobe_cep__) return res(""); window.__adobe_cep__.evalScript(script, r => res(r)); }); }
const EXT_DIR = (() => { try { return decodeURIComponent(location.pathname).replace(/^\/([A-Za-z]:)/, "$1").replace(/\/server\.html$/, ""); } catch (e) { return ""; } })();
async function checkHost() {
  await evalAE(`try{$.evalFile(new File(${JSON.stringify(EXT_DIR + "/host/host.jsx")}))}catch(e){}`);
  let r = await evalAE("f2aePing()");
  try { let j = JSON.parse(r); if (!j.ok) { r = await evalAE(`f2aeLoad(${JSON.stringify(EXT_DIR)})`); j = JSON.parse(r); } hostOk = !!j.ok; hostErr = j.error || ""; project = j.project || ""; }
  catch (e) { hostOk = false; hostErr = r || "sem resposta do After Effects"; }
}
function settings() { try { return JSON.parse(fs.readFileSync(path.join(BASE, "_config.json"), "utf8")); } catch (e) { return {}; } }
function writeState(extra) {
  try { fs.mkdirSync(BASE, { recursive: true }); fs.writeFileSync(STATE, JSON.stringify(Object.assign({ server: true, port: PORT, lastPing: Date.now(), hostOk, hostErr, project, discord }, extra || {}))); } catch (e) {}
}
function studioOpen() { try { return Date.now() - fs.statSync(path.join(BASE, "_studio.json")).mtimeMs < 6000; } catch (e) { return false; } }
function openPanel() { if (studioOpen()) return; try { window.__adobe_cep__.requestOpenExtension(PANEL_ID, ""); } catch (e) {} }

function unzipTo(buf, dir) {
  let p = 0, n = 0;
  while (p + 30 <= buf.length && buf.readUInt32LE(p) === 0x04034b50) {
    const method = buf.readUInt16LE(p + 8), flags = buf.readUInt16LE(p + 6);
    const csize = buf.readUInt32LE(p + 18), nlen = buf.readUInt16LE(p + 26), xlen = buf.readUInt16LE(p + 28);
    const name = buf.slice(p + 30, p + 30 + nlen).toString(flags & 0x800 ? "utf8" : "latin1");
    const start = p + 30 + nlen + xlen;
    if (flags & 8 && csize === 0) throw new Error("zip com descritor de dados não suportado; exporte de novo pelo plugin");
    const raw = buf.slice(start, start + csize);
    const data = method === 0 ? raw : method === 8 ? zlib.inflateRawSync(raw) : null;
    if (!data) throw new Error("compressão não suportada no zip");
    const safe = name.replace(/\\/g, "/").split("/").filter(x => x && x !== ".." && x !== ".").join(path.sep);
    if (!name.endsWith("/") && safe) { const out = path.join(dir, safe); fs.mkdirSync(path.dirname(out), { recursive: true }); fs.writeFileSync(out, data); n++; }
    p = start + csize;
  }
  if (!n) throw new Error("pacote vazio ou inválido");
  return n;
}
function stamp() { const d = new Date(), z = x => String(x).padStart(2, "0"); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`; }
function savePackage(buf, label) {
  const id = stamp() + "_" + Math.random().toString(36).slice(2, 6);
  const dir = path.join(BASE, id);
  fs.mkdirSync(dir, { recursive: true });
  try {
    unzipTo(buf, dir);
    const pkg = JSON.parse(fs.readFileSync(path.join(dir, "figma2ae.json"), "utf8"));
    if (pkg.format !== "figma2ae") throw new Error("não é um pacote do Figma2AE");
    const n = (pkg.comps || pkg.scenes || []).length;
    fs.writeFileSync(path.join(dir, "_meta.json"), JSON.stringify({ id, label: label || pkg.file || "Figma", time: Date.now(), status: "new", comps: n }));
    return { id, comps: n };
  } catch (e) { try { fs.rmSync(dir, { recursive: true, force: true }); } catch (e2) {} throw e; }
}

function cors(res) {
  res.setHeader("Access-Control-Allow-Origin", "*");
  res.setHeader("Access-Control-Allow-Methods", "GET, POST, OPTIONS");
  res.setHeader("Access-Control-Allow-Headers", "Content-Type, X-F2AE-Name");
  res.setHeader("Access-Control-Allow-Private-Network", "true");
}
/* ---------- atualizações (botão "Atualizar" no plugin do Figma e no painel) ---------- */
let updater = null;
function upd() {
  if (updater) return updater;
  try {
    updater = require(EXT_DIR + "/updater.js").create({ extDir: EXT_DIR, unzip: unzipTo, studioOpen, log: m => console.log("[Figma2AE update] " + m) });
  } catch (e) { updater = null; }
  return updater;
}
function updState() { const u = upd(); if (!u) return null; const s = u.state; return { current: s.current, latest: s.latest, available: s.available, notes: s.notes, busy: s.busy, phase: s.phase, progress: s.progress, error: s.error, done: s.done, studioPending: s.studioPending }; }
function sendJSON(res, code, obj) { res.writeHead(code, { "Content-Type": "application/json" }); res.end(JSON.stringify(obj)); }

function handler(req, res) {
  cors(res);
  if (req.method === "OPTIONS") { res.writeHead(204); return res.end(); }
  if (req.url.startsWith("/update")) {
    const u = upd();
    if (!u) return sendJSON(res, 500, { ok: false, error: "atualizador não carregou" });
    if (req.method === "GET" && req.url.startsWith("/update/check")) {
      u.check(/force/.test(req.url)).then(() => sendJSON(res, 200, Object.assign({ ok: true }, updState())));
      return;
    }
    if (req.method === "GET" && req.url.startsWith("/update/status")) return sendJSON(res, 200, Object.assign({ ok: true }, updState()));
    if (req.method === "POST" && req.url.startsWith("/update/apply")) {
      u.apply().then(r => sendJSON(res, 200, r)).catch(e => sendJSON(res, 200, { ok: false, error: e.message }));
      return;
    }
    return sendJSON(res, 404, { ok: false });
  }
  if (req.method === "GET" && req.url.startsWith("/ping")) {
    if (Date.now() - lastStateWrite > 1500) { lastStateWrite = Date.now(); writeState(); }
    res.writeHead(200, { "Content-Type": "application/json" });
    return res.end(JSON.stringify({ app: "Figma2AE", ok: hostOk, error: hostErr, project, auto: !!settings().oAuto && !studioOpen(), studio: studioOpen(), update: updState() }));
  }
  if (req.method === "POST" && req.url.startsWith("/package")) {
    const chunks = []; let size = 0;
    req.on("data", c => { size += c.length; if (size > 1024 * 1024 * 1024) req.destroy(); else chunks.push(c); });
    req.on("end", () => {
      try {
        const r = savePackage(Buffer.concat(chunks), decodeURIComponent(req.headers["x-f2ae-name"] || ""));
        writeState({ lastPackage: r.id });
        res.writeHead(200, { "Content-Type": "application/json" });
        res.end(JSON.stringify({ ok: true, comps: r.comps, auto: !!settings().oAuto && !studioOpen(), studio: studioOpen() }));
        openPanel(); // o painel lê a pasta Recebidos e mostra o pacote novo
      } catch (e) {
        res.writeHead(400, { "Content-Type": "application/json" });
        res.end(JSON.stringify({ ok: false, error: e.message }));
      }
    });
    return;
  }
  if (req.method === "POST" && req.url.startsWith("/build")) {
    // pedido do Figma2AE Studio: monta as tomadas de um pacote recebido
    const chunks = [];
    req.on("data", c => chunks.push(c));
    req.on("end", async () => {
      let out;
      try {
        const body = JSON.parse(Buffer.concat(chunks).toString("utf8"));
        const id = String(body.id || "").replace(/[^A-Za-z0-9_\-]/g, "");
        const dir = path.join(BASE, id);
        if (!id || !fs.existsSync(path.join(dir, "figma2ae.json"))) throw new Error("pacote não encontrado: " + id);
        if (!body.plan || body.plan.format !== "figma2ae-plan") throw new Error("plano inválido");
        const pf = path.join(dir, "plano_" + Date.now() + ".json");
        fs.writeFileSync(pf, JSON.stringify(body.plan), "utf8");
        const o = Object.assign({ fps: 30, duration: 5, states: "guias", master: true, openAfter: true }, body.opts || {});
        await checkHost();
        const r = await evalAE(`f2aeBuildPlan(${JSON.stringify(pf.replace(/\\/g, "/"))}, ${JSON.stringify(o)})`);
        try { out = JSON.parse(r); } catch (e) { out = { ok: false, error: r || "o After Effects não respondeu" }; }
        if (out.ok) { try { const mf = path.join(dir, "_meta.json"), m = JSON.parse(fs.readFileSync(mf, "utf8")); m.status = "done"; m.studio = true; fs.writeFileSync(mf, JSON.stringify(m)); } catch (e) {} }
      } catch (e) { out = { ok: false, error: e.message }; }
      res.writeHead(200, { "Content-Type": "application/json" });
      res.end(JSON.stringify(out));
    });
    return;
  }
  res.writeHead(404); res.end();
}
function listen(host) {
  return new Promise(ok => { const s = http.createServer(handler); s.on("error", e => ok({ err: e })); s.listen(PORT, host, () => ok({ s })); });
}
(async () => {
  fs.mkdirSync(BASE, { recursive: true });
  const r = await listen("127.0.0.1");
  listen("::1");
  writeState({ server: !r.err, serverErr: r.err ? (r.err.code === "EADDRINUSE" ? "porta " + PORT + " em uso" : r.err.message) : "", lastPing: 0 });
  // Discord: "Jogando After Effects" enquanto o After estiver aberto
  try {
    require(EXT_DIR + "/discord.js").start({ onStatus: st => {
      discord = st;
      try { const cur = JSON.parse(fs.readFileSync(STATE, "utf8")); cur.discord = st; fs.writeFileSync(STATE, JSON.stringify(cur)); } catch (e) {}
    } });
  } catch (e) { discord = { status: "erro", error: e.message }; }
  await checkHost();
  setInterval(checkHost, 15000);
  // procura atualização logo depois de abrir e a cada 6 h; troca o Studio pendente quando ele fechar
  setTimeout(() => { const u = upd(); if (u) u.check(true); }, 8000);
  setInterval(() => { const u = upd(); if (u) u.check(true); }, 6 * 3600e3);
  setInterval(() => { const u = upd(); if (u) u.applyPendingStudio(); }, 30000);
})();
if (typeof module !== "undefined") module.exports = { unzipTo, savePackage };
</script>
</body></html>
