<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Figma2AE</title>
<style>
:root{
  --bg:#232323; --panel:#2b2b2b; --panel2:#333333; --panel3:#3c3c3c; --line:#454545; --line2:#303030;
  --text:#d8d8d8; --muted:#9a9a9a; --faint:#6b6b6b; --beige:#2d8ceb; --beige2:#5aa9f5;
  --ok:#8ccf9e; --warn:#e7c86b; --bad:#e08a7a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:12px/1.45 "Segoe UI",Inter,system-ui,sans-serif;overflow:hidden;user-select:none}
button,select,input{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#454545;border-radius:4px}
.app{display:flex;flex-direction:column;height:100%}
.app > *{flex:none}.app > .main{flex:1;min-height:0}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px 8px}
.logo{width:18px;height:18px;border-radius:4px;background:var(--beige);position:relative;flex:none}
.logo:after{content:"";position:absolute;inset:5px;border-radius:2px;background:var(--bg)}
.brand{font-weight:700;color:var(--beige);font-size:13px}
.pill{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:99px;padding:3px 9px;color:var(--muted);font-size:11px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px #8ccf9e22}
.dot.bad{background:var(--bad)}
.bar{display:flex;gap:6px;padding:0 12px 8px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:6px 10px;border-radius:4px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--panel2)}
.btn.primary{background:var(--beige);color:#ffffff;border-color:var(--beige);font-weight:700}
.btn.primary:hover:not(:disabled){background:#4a9ff0}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){color:var(--text);background:var(--panel)}
.btn.sm{padding:3px 8px;font-size:11px}
.main{overflow:auto;padding:0 12px 12px}
.empty{color:var(--muted);text-align:center;padding:34px 12px;line-height:1.7}
.empty b{color:var(--beige2)}
.steps{margin:16px 0 0;text-align:left;background:var(--panel);border-radius:4px;padding:10px 12px;font-size:11.5px}
.steps div{display:flex;gap:8px;margin:5px 0}
.steps i{font-style:normal;color:var(--bg);background:var(--beige2);border-radius:50%;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex:none;margin-top:1px}
.pkg{background:var(--panel);border-radius:4px;margin-bottom:10px;overflow:hidden;border:1px solid var(--line2)}
.pkg.done{opacity:.72}
.ph{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line2)}
.ph .t{flex:1;min-width:0}
.ph .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--beige)}
.ph .t small{color:var(--faint)}
.grp{color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:600;padding:8px 10px 2px}
.cp{display:grid;grid-template-columns:16px 72px 1fr;gap:9px;align-items:center;padding:6px 10px;cursor:pointer}
.cp:hover{background:var(--panel2)}
.cp img,.cp .noimg{width:72px;height:44px;object-fit:contain;background:#151515;border-radius:4px;border:1px solid var(--line2);display:block}
.cp .nm{min-width:0}
.cp .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp .nm small{display:block;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tagp{color:var(--warn);font-size:10px;font-weight:700}
.pf{display:flex;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid var(--line2)}
.pf .info{color:var(--faint);font-size:11px;margin-right:auto}
.res{padding:8px 10px;border-top:1px solid var(--line2);font-size:11px;color:var(--muted)}
.res .ok{color:var(--ok);font-weight:600}
.res .err{color:var(--bad);font-weight:600}
.res ul{margin:4px 0 0;padding-left:16px;max-height:120px;overflow:auto}
.res a{color:var(--beige2);cursor:pointer;text-decoration:underline}
input[type=checkbox]{accent-color:var(--beige2);width:14px;height:14px;margin:0;cursor:pointer}
.opts{border-top:1px solid var(--line2);padding:8px 12px 10px;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;background:#1e1e1e}
.opts label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11.5px}
.opts select,.opts input[type=number]{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 4px;color:var(--text);width:70px}
.opts .full{grid-column:1/-1}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--faint);border-top-color:var(--beige);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:12px;right:12px;bottom:70px;background:#333333;border:1px solid var(--line);border-radius:4px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.45);font-size:11.5px;z-index:9}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20}
.modal .box{background:#2b2b2b;border:1px solid #3a3a3a;border-radius:4px;padding:14px;max-width:360px;margin:12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.modal p{margin:8px 0;color:#d0d0d0;font-size:12px}.modal p.small{color:#8c8c8c;font-size:11px}
.modal .row{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.btn.danger{background:#b3372f;border-color:#b3372f;color:#fff}.btn.danger:hover{background:#cc4339}
.dc{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border-top:1px solid var(--line2);padding-top:7px;margin-top:2px}
.dc input[type=text]{flex:1;min-width:150px;background:#1e1e1e;border:1px solid #3a3a3a;border-radius:4px;padding:3px 6px;color:var(--text);font-size:11px}
.dst{font-size:10.5px;color:var(--muted)}.dst.on{color:#5ec07a}.dst.bad{color:#e0795e}
.upd{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#1d3550;border-bottom:1px solid #2d8ceb66;font-size:11.5px}
.upd .t{flex:1;min-width:0}.upd .t b{color:#fff}.upd .t small{display:block;color:#a9c7e8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upd button{background:#2d8ceb;border:0;color:#fff;border-radius:4px;padding:5px 10px;font-weight:600;cursor:pointer}
.upd.ok{background:#1f3b2a}.upd.err{background:#3a2622}
/* ===== tema After Effects ===== */
html,body{font-family:"Segoe UI",system-ui,sans-serif}
::selection{background:#2d8ceb55}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:#2d8ceb}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:1px solid #2d8ceb;outline-offset:0}
::-webkit-scrollbar-thumb{background:#454545!important;border-color:transparent!important;border-radius:2px!important}
/* abas e botões no estilo dos painéis do AE */
nav button.on,.seg button.on,.tabs button.on,.tab.on{background:#3a3a3a!important;color:#ffffff!important;box-shadow:inset 0 -2px 0 #2d8ceb}
.btn.primary,button.primary{color:#ffffff!important}
.btn.primary:hover:not(:disabled),button.primary:hover:not(:disabled){background:#4a9ff0!important;border-color:#4a9ff0!important}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{background-color:#1e1e1e;border-color:#3a3a3a}
.logo{background:none!important;border-radius:0!important}.logo:after{display:none!important}

/* ===== refinamento visual (2.3.2) ===== */
.vchip{margin-left:6px;font-size:10px;font-weight:600;color:#9fbfe2;background:#2d8ceb1f;border:1px solid #2d8ceb40;border-radius:99px;padding:1px 7px;vertical-align:1px}
.top{background:linear-gradient(180deg,#202020,#1b1b1b);border-bottom:1px solid var(--line2)}
.btn,.cp,.pkg,.pill,.upd button,select,input[type=text],input[type=number]{transition:background-color .14s,border-color .14s,color .14s,box-shadow .14s,transform .08s,opacity .14s}
.btn:active:not(:disabled),.upd button:active{transform:translateY(1px)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #5aa9f5;outline-offset:1px}
.btn.primary{background:linear-gradient(180deg,#3796ee,#2a84de)!important;box-shadow:0 1px 0 #ffffff1f inset,0 2px 8px #2d8ceb33}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#4aa2f2,#3390e6)!important}
.btn.primary:disabled{background:#2e3b48!important;border-color:#2e3b48!important;box-shadow:none;color:#8a99a8!important}
.pkg{box-shadow:0 1px 0 #ffffff08 inset}.pkg:hover{border-color:#383838}
.cp{border-left:3px solid transparent}.cp:hover{border-left-color:#5aa9f5}
.cp img:hover{border-color:#5aa9f5}
.pill{border:1px solid var(--line2)}
.dot.on{animation:aepulse 2.2s ease-out infinite}
@keyframes aepulse{0%{box-shadow:0 0 0 0 #8ccf9e66}70%{box-shadow:0 0 0 6px #8ccf9e00}100%{box-shadow:0 0 0 0 #8ccf9e00}}
.opts label{cursor:pointer}.opts label:hover{color:var(--text)}
.modal{animation:fadein .16s ease-out}.modal .box{animation:popin .18s ease-out}
.toast{animation:popin .18s ease-out}.upd{animation:fadein .2s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
</style>
</head>

"use strict";
const PORT = 7452;
const { Buffer } = require("buffer");
const http = require("http"), fs = require("fs"), path = require("path"), os = require("os"), zlib = require("zlib");
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const PATHS = (() => { try { return require(EXT_DIR_P + "/paths.js"); } catch (e) { return null; } })();
const BASE = path.join(PATHS ? PATHS.docs() : path.join(os.homedir(), "Documents", "Figma2AE"), "Recebidos");
const STUDIO_EXE = PATHS ? PATHS.studioExe() : path.join(process.env.LOCALAPPDATA || "", "Programs", "Figma2AE Studio", "Figma2AE Studio.exe");
let INBOX = [], hostInfo = null, serverOk = false, serverErr = "", lastPing = 0, busy = false;

/* ---------- ponte com o After Effects ---------- */
function evalAE(script) {
  return new Promise(res => {
    if (!window.__adobe_cep__) return res("");
    window.__adobe_cep__.evalScript(script, r => res(r));
  });
}
const EXT_DIR = (() => { try { return decodeURIComponent(location.pathname).replace(/^\/([A-Za-z]:)/, "$1").replace(/\/index\.html$/, ""); } catch (e) { return ""; } })();
let hostLoaded = false;
async function ensureHost() {

function unzipTo(buf, dir) {
  // lê zip (sem compressão ou deflate) e grava os arquivos
  let p = 0, n = 0;
  while (p + 30 <= buf.length && buf.readUInt32LE(p) === 0x04034b50) {
    const method = buf.readUInt16LE(p + 8), flags = buf.readUInt16LE(p + 6);
    let csize = buf.readUInt32LE(p + 18);
    const nlen = buf.readUInt16LE(p + 26), xlen = buf.readUInt16LE(p + 28);
    const name = buf.slice(p + 30, p + 30 + nlen).toString(flags & 0x800 ? "utf8" : "latin1");
    const start = p + 30 + nlen + xlen;
    if (flags & 8 && csize === 0) throw new Error("zip com descritor de dados não suportado; exporte de novo pelo plugin");
    const raw = buf.slice(start, start + csize);
    const data = method === 0 ? raw : method === 8 ? zlib.inflateRawSync(raw) : null;
    if (!data) throw new Error("compressão não suportada no zip");
    const safe = name.replace(/\\/g, "/").split("/").filter(x => x && x !== ".." && x !== ".").join(path.sep);
    if (!name.endsWith("/") && safe) { const out = path.join(dir, safe); fs.mkdirSync(path.dirname(out), { recursive: true }); fs.writeFileSync(out, data); n++; }
    p = start + csize;
  }
  if (!n) throw new Error("pacote vazio ou inválido");
  return n;
}

function addPackage(buf, label) {
  // pacote aberto à mão pelo botão "Abrir pacote…"
  const id = "local_" + stamp() + "_" + Math.random().toString(36).slice(2, 6);
  const dir = path.join(BASE, id);
  fs.mkdirSync(dir, { recursive: true });
  unzipTo(buf, dir);
  const pkg = JSON.parse(fs.readFileSync(path.join(dir, "figma2ae.json"), "utf8"));
  if (pkg.format !== "figma2ae") throw new Error("não é um pacote do Figma2AE");
  const item = makeItem(id, dir, pkg, label, new Date(), "new");

}
function makeItem(id, dir, pkg, label, time, status) {
  const comps = (pkg.comps || (pkg.scenes || []).map(s => ({ compName: s.compName, group: "", frameName: s.name, width: s.width, height: s.height, layers: s.layers }))).map((c, i) => ({
    i, compName: c.compName, group: c.group || "", frameName: c.frameName || "", w: c.width, h: c.height, partial: !!c.partial,
    ref: c.ref ? path.join(dir, c.ref.file) : null, layers: (c.layers || []).length, on: true
  }));
  const seqOf = {}; (pkg.sequences || []).forEach(q => (q.comps || []).forEach(i => seqOf[i] = q.name));

function scanInbox(first) {
