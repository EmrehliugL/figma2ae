<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
:root{
  --bg:#1e1e1e; --s1:#252525; --s2:#2c2c2c; --s3:#333; --bd:#343434; --bd2:#2a2a2a;
  --text:#e2e2e2; --muted:#a3a3a3; --faint:#707070;
  --accent:#2d8ceb; --accent2:#5aa9f5; --ok:#6fcf8e; --warn:#e7c86b; --err:#e0795e;
  /* nomes antigos (ainda usados em alguns lugares) */
  --panel:var(--s1); --panel2:var(--s2); --panel3:var(--s3); --line:var(--bd); --line2:var(--bd2);
  --beige:var(--accent); --beige2:var(--accent2); --new:var(--ok); --mod:var(--warn);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:12px/1.45 Inter,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,select{font:inherit;cursor:pointer;color:inherit}
button:disabled{opacity:.45;cursor:default}
[hidden]{display:none!important}
::selection{background:#2d8ceb55}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#404040;border-radius:4px;border:2px solid var(--bg)}::-webkit-scrollbar-thumb:hover{background:#4c4c4c}
:focus-visible{outline:2px solid var(--accent2);outline-offset:1px}
.app{display:flex;flex-direction:column;height:100%}
.app > *{flex:none}.app > .main{flex:1;min-height:0}

/* ---- topo ---- */
.top{display:flex;align-items:center;gap:8px;height:44px;padding:0 10px 0 12px;border-bottom:1px solid var(--bd2)}
.brand{font-weight:700;font-size:12.5px;color:var(--text);display:flex;align-items:center;gap:7px;min-width:0}
.logo{width:16px;height:16px;flex:none}
.vchip{font-size:10px;font-weight:600;color:var(--faint);background:var(--s2);border-radius:99px;padding:1px 7px;letter-spacing:.2px}
.top .sp{flex:1}
.qbtn{display:inline-flex;align-items:center;gap:5px;height:26px;border:1px solid var(--bd);background:var(--s1);color:var(--muted);border-radius:99px;padding:0 10px 0 8px;font-size:11px;font-weight:600;white-space:nowrap;flex:none;transition:background-color .12s,border-color .12s,color .12s}
.qbtn svg{width:11px;height:11px;color:var(--accent2)}
.qbtn:hover{background:var(--s2);border-color:#454545;color:var(--text)}
.aepill{display:flex;align-items:center;gap:6px;height:26px;border:1px solid var(--bd);background:var(--s1);border-radius:99px;padding:0 10px;color:var(--muted);font-size:11px;white-space:nowrap;flex:none}
.aedot{width:7px;height:7px;border-radius:50%;background:#5a5a5a;flex:none}
.aedot.on{background:var(--ok);animation:aepulse 2.4s ease-out infinite}
@keyframes aepulse{0%{box-shadow:0 0 0 0 #6fcf8e66}70%{box-shadow:0 0 0 5px #6fcf8e00}100%{box-shadow:0 0 0 0 #6fcf8e00}}

/* ---- faixa de atualização ---- */
.upd{display:flex;align-items:center;gap:10px;margin:8px 10px 0;padding:8px 8px 8px 12px;background:#1d3044;border:1px solid #2d8ceb55;border-radius:8px;font-size:11.5px;animation:fadein .2s ease-out}
.upd .t{flex:1;min-width:0}.upd .t b{color:#fff;font-weight:600}.upd .t small{display:block;color:#a9c7e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upd button{background:var(--accent);border:0;color:#fff;border-radius:6px;height:26px;padding:0 12px;font-weight:600;font-size:11.5px;flex:none}
.upd button:hover:not(:disabled){background:#4aa2f2}
.upd.ok{background:#1d3427;border-color:#5ec07a55}.upd.ok .t small{color:#a9d8b7}.upd.ok button{background:#2f9e5b}
.upd.err{background:#3a2622;border-color:#e0795e55}.upd.err .t small{color:#e6b3a6}.upd.err button{background:#b5503c}

/* ---- lista ---- */
.main{overflow:auto;padding:10px}
.head{display:flex;align-items:baseline;gap:6px;margin:2px 2px 8px}
.head b{font-size:12.5px;font-weight:600;color:var(--text)}
.head span{color:var(--faint);font-size:11px}
.grph{display:flex;align-items:center;gap:8px;margin:12px 2px 6px}
.grph:first-of-type{margin-top:4px}
.grph label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:600;cursor:pointer;min-width:0;flex:1}
.grph label span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grph label:hover{color:var(--text)}
.mini{height:22px;border:1px solid var(--bd);background:transparent;color:var(--muted);border-radius:99px;padding:0 10px;font-size:10.5px;white-space:nowrap;flex:none;transition:background-color .12s,border-color .12s,color .12s}
.mini:hover{color:var(--text);background:var(--s2)}
.mini.on{border-color:#2d8ceb88;color:#cfe4fb;background:#2d8ceb1f}
.row{display:grid;grid-template-columns:15px 60px 1fr auto;gap:10px;align-items:center;background:var(--s1);border:1px solid transparent;border-radius:8px;padding:7px 10px 7px 9px;margin-bottom:5px;transition:background-color .12s,border-color .12s,opacity .12s}
.row:hover{background:#2a2a2a;border-color:var(--bd)}
.row.off{opacity:.45}
.row .ck{display:flex;align-items:center}
.th{width:60px;height:36px;border-radius:5px;background:var(--s3) center/contain no-repeat;border:1px solid var(--bd2);cursor:zoom-in;transition:border-color .12s,box-shadow .12s}
.th:hover{border-color:var(--accent2);box-shadow:0 0 0 2px #2d8ceb33}
.nm{min-width:0}
.nm b{display:block;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.nm small{display:block;color:var(--faint);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;color:var(--muted);background:var(--s3)}
.tag.frame{color:#9fd9b1;background:#6fcf8e17}
.tag.objetos{color:#ecd58f;background:#e7c86b17}

/* ---- tela vazia ---- */
.empty{padding:14px 4px 6px;text-align:center;color:var(--muted)}
.empty .ico{width:34px;height:34px;margin:0 auto 8px;border-radius:10px;background:var(--s1);border:1px solid var(--bd);display:grid;place-items:center;color:var(--accent2)}
.empty .ico svg{width:18px;height:18px}
.empty h4{margin:0;color:var(--text);font-size:13px;font-weight:600}
.empty p{margin:3px 0 0;font-size:11.5px}
.rules{margin:12px auto 0;max-width:380px;display:grid;gap:5px;text-align:left}
.rules div{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--bd2);border-radius:8px;padding:6px 10px;font-size:11.5px;line-height:1.35;color:var(--muted)}
.rules i{font-style:normal;flex:none;width:22px;height:22px;border-radius:6px;background:#2d8ceb17;color:var(--accent2);display:grid;place-items:center;font-size:12px}
.rules b{color:var(--text);font-weight:600}

/* ---- opções e envio ---- */
.opts{border-top:1px solid var(--bd2);background:#1b1b1b;padding:8px 10px 10px}
.ohead{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:4px 2px;color:var(--muted);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;text-align:left}
.ohead:hover{color:var(--text)}
.ohead .sum{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint);font-size:11px}
.ohead svg{width:10px;height:10px;transition:transform .15s;flex:none}
.opts.closed .ohead svg{transform:rotate(-90deg)}
.opts.closed .optgrid{display:none}
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin:4px 0 2px}
.opts label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11.5px;padding:4px 2px;border-radius:5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.opts label:hover{color:var(--text)}
.opts select{margin-left:auto;background:var(--s2);border:1px solid var(--bd);border-radius:5px;padding:1px 4px;color:var(--text);font-size:11.5px}
.go{display:flex;gap:6px;align-items:center;margin-top:8px}
.btn{height:32px;border:1px solid var(--bd);background:var(--s1);padding:0 12px;border-radius:7px;color:var(--text);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background-color .12s,border-color .12s,box-shadow .12s,transform .08s}
.btn svg{width:13px;height:13px}
.btn:hover:not(:disabled){background:var(--s2);border-color:#454545}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{flex:1;height:34px;background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;box-shadow:0 1px 0 #ffffff1f inset}
.btn.primary:hover:not(:disabled){background:#4aa2f2;border-color:#4aa2f2}
.btn.primary:disabled{background:#2a3642;border-color:#2a3642;color:#8796a5;opacity:1;box-shadow:none}
.foot{display:flex;align-items:center;gap:6px;margin-top:7px;min-height:16px;font-size:11px;color:var(--faint)}
.foot:has(#status:empty){display:none}
.foot #status{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{color:var(--faint);font-size:11px}
#aehint.warn{color:#e0b36b}
.spin{display:inline-block;width:10px;height:10px;border:2px solid #4a4a4a;border-top-color:var(--accent2);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px;margin-right:2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- janelas ---- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:10;padding:14px;animation:fadein .16s ease-out}
.modal > div{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:16px;width:min(440px,100%);max-height:100%;overflow:auto;box-shadow:0 18px 50px #000a;animation:popin .18s ease-out}
.modal h3{margin:0 0 6px;color:var(--text);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.modal h3:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.modal .hint{color:var(--muted);line-height:1.5}
.modal .hint b{color:var(--text)}
.modal ul{list-style:none;padding:6px 8px;margin:6px 0;max-height:150px;overflow:auto;background:#1e1e1e;border:1px solid var(--bd2);border-radius:7px;color:var(--muted);font-size:11px}
.modal li{padding:3px 2px 3px 14px;position:relative}
.modal li:before{content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
.modal #ok{min-width:72px}
.modal.err h3:before{background:var(--err)}
.modal.warn h3:before{background:var(--warn)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}

.rz{position:fixed;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;z-index:99;touch-action:none;opacity:.7;background:linear-gradient(135deg,transparent 0 55%,#555 55% 62%,transparent 62% 72%,#555 72% 79%,transparent 79% 89%,#555 89%)}
.rz:hover{opacity:1}
body.resizing,body.resizing *{user-select:none!important;cursor:nwse-resize!important}

/* ---- controles clean: caixa de seleção e campo numérico com setinhas próprias ---- */
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:15px;height:15px;margin:0;flex:none;border:1.5px solid #555;border-radius:4px;background:#1b1b1b;display:inline-grid;place-content:center;cursor:pointer;vertical-align:middle;transition:background-color .14s,border-color .14s,box-shadow .14s}
input[type=checkbox]:hover{border-color:#7a7a7a}
input[type=checkbox]:checked{background:#2d8ceb;border-color:#2d8ceb}
input[type=checkbox]::after{content:"";width:7px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform .14s cubic-bezier(.3,1.5,.6,1)}
input[type=checkbox]:checked::after{transform:translateY(-1px) rotate(-45deg) scale(1)}
input[type=checkbox]:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(45,140,235,.35)}
input[type=checkbox]:disabled{opacity:.45;cursor:default}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.f2num{position:relative;display:inline-flex;align-items:stretch;vertical-align:middle}
.f2num>input[type=number]{padding-right:20px!important}
.f2num .stp{position:absolute;right:2px;top:2px;bottom:2px;width:15px;display:flex;flex-direction:column;border-left:1px solid #333;opacity:.55;transition:opacity .14s}
.f2num:hover .stp,.f2num:focus-within .stp{opacity:1}
.f2num .stp button{flex:1;min-height:0;padding:0;margin:0;border:0;background:transparent;color:#bbb;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:2px;line-height:0}
.f2num .stp button:hover{background:#2f2f2f;color:#fff}
.f2num .stp button:active{background:#2d8ceb;color:#fff}
.f2num .stp svg{width:7px;height:5px;display:block}

/* ===== Quick Import (v2.8): barrinha só com ícones ===== */
#quick{display:none;align-items:center;gap:6px;height:100%;padding:0 8px;background:#1e1e1e}
body.isquick .app,body.isquick .rz{display:none}
body.isquick #quick{display:flex}
.qi-btn{position:relative;overflow:visible;width:40px;height:36px;border-radius:8px;border:1px solid #ffffff12;background:#ffffff08;color:#d8d8d8;display:grid;place-items:center;padding:0;flex:none;transition:background-color .12s,border-color .12s,color .12s,transform .08s}
.qi-btn svg{width:18px;height:18px}
.qi-btn:hover:not(:disabled){background:#ffffff14;border-color:#ffffff2a;color:#fff}
.qi-btn:active:not(:disabled){transform:scale(.94)}
.qi-btn:disabled{opacity:.35;cursor:default}
.qi-btn.main{background:#2d8ceb;border-color:#3b97ee;color:#fff}
.qi-btn.main:hover:not(:disabled){background:#4aa2f2;border-color:#4aa2f2}
.qi-btn .qn{position:absolute;z-index:2;top:-5px;right:-5px;min-width:15px;height:15px;padding:0 4px;border-radius:99px;background:#f2f2f2;color:#1b1b1b;font-size:9.5px;font-weight:800;line-height:15px;text-align:center;box-shadow:0 0 0 2px #1e1e1e}
.qi-btn .qn:empty{display:none}
.qi-btn.ok{background:#2f9e5b!important;border-color:#3cb36c!important;color:#fff!important}
.qi-btn.err{background:#b5503c!important;border-color:#cf6450!important;color:#fff!important;animation:qshake .3s}
.qi-btn.busy svg{animation:qpulse .8s ease-in-out infinite}
@keyframes qshake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes qpulse{50%{opacity:.35}}
.qsm{width:28px;height:28px;border-radius:7px;border:0;background:transparent;color:#8a8a8a;display:grid;place-items:center;padding:0;flex:none;font-size:10.5px;font-weight:700}
.qsm svg{width:14px;height:14px}
.qsm:hover{background:#ffffff10;color:#eee}
.qsep{width:1px;height:22px;background:#ffffff14;flex:none}
#qdot{width:7px;height:7px;flex:none;margin:0 2px}
</style>
</head>

<script>
const F2AE_VERSION = "2.11.0"; // carimbado pelo tools/publicar.py
const $ = s => document.querySelector(s);
setTimeout(() => { const v = document.getElementById("vchip"); if (v) v.textContent = "v" + F2AE_VERSION; }, 0);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const send = m => parent.postMessage({ pluginMessage: m }, "*");
let TARGETS = [], busy = false, MODE = "send"; const thumbs = {};
const OFF = new Set();      // frames desmarcados na lista
const WHOLE = new Set();    // contêineres que viram 1 comp só
const checked = () => TARGETS.filter(t => !OFF.has(t.key));
const AE_URL = "http://localhost:7452";
const AE = { on: false, project: "" };
async function pingAE() {
  try {
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 1500);
    const r = await fetch(AE_URL + "/ping", { signal: ctl.signal }); clearTimeout(tm);
    const j = await r.json(); AE.on = j.app === "Figma2AE"; AE.project = j.project || ""; AE.auto = !!j.auto; AE.route = j.route || (j.studio ? "studio" : "panel"); AE.update = j.update || null;
  } catch (e) { AE.on = false; }
  $("#aedot").className = "aedot" + (AE.on ? " on" : "");
  $("#aetxt").textContent = AE.on ? "AE conectado" : "AE desconectado";
  $("#aepill").title = AE.on ? "Painel aberto no After Effects" + (AE.project ? " · " + AE.project : "") : "Abra no After Effects: Janela → Extensões → Figma2AE";
  const dest = AE.route === "studio" ? "Abre no Figma2AE Studio pra separar as tomadas e montar no After." : AE.auto ? "Modo automático: o After importa assim que receber." : "Abre no painel Figma2AE do After pra você importar.";
  $("#exportar").title = AE.on ? dest : "";
  $("#aehint").hidden = AE.on; $("#aehint").className = "hint warn";
  $("#aehint").textContent = AE.on ? "" : "After Effects fechado: abra ele (a extensão liga junto) ou salve o .zip.";
  paintUpdate();
  setBusy(busy);
  if (QUICK) qrender();
}
setInterval(pingAE, 2500);
/* ---------- atualização: o After Effects (receptor) baixa e instala; aqui é só o botão ---------- */
function verNewer(a, b) { const x = String(a).split(".").map(Number), y = String(b).split(".").map(Number); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; }
let UPD_LOCAL = null; // estado local enquanto atualiza / depois de atualizar
function paintUpdate() {
  const el = $("#upd"), u = AE.on ? AE.update : null;
  if (UPD_LOCAL) {
    el.hidden = false; el.className = "upd " + (UPD_LOCAL.kind || "");
    el.innerHTML = `<div class="t">${UPD_LOCAL.html}</div>` + (UPD_LOCAL.button ? `<button id="updgo">${UPD_LOCAL.button}</button>` : "");
    const b = $("#updgo"); if (b) b.onclick = UPD_LOCAL.onclick; return;
  }
  if (u && u.busy) { el.hidden = false; el.className = "upd"; el.innerHTML = `<div class="t"><b>Atualizando…</b><small>${esc(u.phase || "")} ${u.progress ? u.progress + "%" : ""}</small></div>`; return; }
  // o Figma só carrega o código novo do plugin quando ele é aberto de novo
  if (u && u.current && !u.available && verNewer(u.current, F2AE_VERSION)) {
    el.hidden = false; el.className = "upd";
    el.innerHTML = `<div class="t"><b>Versão ${esc(u.current)} instalada</b><small>Este plugin aberto ainda é a ${F2AE_VERSION}. Feche e abra de novo pra usar a nova.</small></div><button id="updgo">Fechar plugin</button>`;
    $("#updgo").onclick = () => parent.postMessage({ pluginMessage: { type: "close" } }, "*");
    return;
  }
  if (!u || !u.available) { el.hidden = true; return; }
  el.hidden = false; el.className = "upd";
  el.innerHTML = `<div class="t"><b>Atualização disponível: v${esc(u.latest)}</b><small title="${esc(u.notes)}">${esc(u.notes || "Melhorias e correções.")} · você tem a v${esc(u.current)}</small></div><button id="updgo">Atualizar</button>`;
  $("#updgo").onclick = runUpdate;
}
async function runUpdate() {
  UPD_LOCAL = { html: "<b>Atualizando…</b><small>baixando e instalando, leva alguns segundos</small>" }; paintUpdate();
  const poll = setInterval(async () => { try { const s = await (await fetch(AE_URL + "/update/status")).json(); if (s.busy) { UPD_LOCAL.html = `<b>Atualizando…</b><small>${esc(s.phase)} ${s.progress ? s.progress + "%" : ""}</small>`; paintUpdate(); } } catch (e) {} }, 700);
  try {
    const r = await (await fetch(AE_URL + "/update/apply", { method: "POST" })).json();
    clearInterval(poll);
    if (!r.ok) throw new Error(r.error || "falhou");
    const studio = r.studio === "pendente" ? " O Studio atualiza assim que você fechar ele." : "";
    UPD_LOCAL = { kind: "ok", html: `<b>Atualizado pra v${esc(r.version)}!</b><small>Feche e abra este plugin e reinicie o After Effects pra usar tudo da versão nova.${studio}</small>`, button: "Fechar plugin", onclick: () => send({ type: "close" }) };
  } catch (e) {
    clearInterval(poll);
    UPD_LOCAL = { kind: "err", html: `<b>Não deu pra atualizar</b><small>${esc(e.message)}</small>`, button: "Tentar de novo", onclick: () => { UPD_LOCAL = null; runUpdate(); } };
  }
  paintUpdate();
}
const OPT_KEYS = ["oRef", "oBg", "oCont", "oHeavy", "oLines", "oScale"];
try { const o = JSON.parse(localStorage.getItem("f2ae_opts") || "{}"); OPT_KEYS.forEach(k => { if (o[k] === undefined) return; const el = $("#" + k); if (el.type === "checkbox") el.checked = o[k]; else el.value = o[k]; }); } catch (e) {}
function optSummary() {
  const n = ["oRef", "oBg", "oCont", "oHeavy", "oLines"].filter(k => $("#" + k).checked).length;
  $("#osum").textContent = n + " de 5 ligadas · " + $("#oScale").value + "x";
}
try { if (localStorage.getItem("f2ae_optsClosed") === "1") $("#opts").classList.add("closed"); } catch (e) {}
$("#ohead").onclick = () => { const c = $("#opts").classList.toggle("closed"); try { localStorage.setItem("f2ae_optsClosed", c ? "1" : "0"); } catch (e) {} };
optSummary();
OPT_KEYS.forEach(k => $("#" + k).addEventListener("change", optSummary));
OPT_KEYS.forEach(k => $("#" + k).onchange = () => { try { const o = {}; OPT_KEYS.forEach(x => { const el = $("#" + x); o[x] = el.type === "checkbox" ? el.checked : el.value; }); localStorage.setItem("f2ae_opts", JSON.stringify(o)); } catch (e) {} });

/* ---------- Quick Import ---------- */
let QUICK = false, QSEL = [], qbusy = false;
let qflashT = 0;
function qstatus(t, kind) {
  // sem texto na barrinha: o resultado aparece no próprio botão (verde = foi, vermelho = erro) e no tooltip
  const btn = QLAST === "raster" ? $("#qras") : $("#qvec");
  ["#qvec", "#qras"].forEach(id => $(id).classList.remove("ok", "err", "busy"));
  $("#qst").textContent = t || "";
  if (!kind) return;
  btn.classList.add(kind);
  if (t) btn.title = t;
  clearTimeout(qflashT);
  if (kind === "ok" || kind === "err") qflashT = setTimeout(() => { btn.classList.remove(kind); qtitles(); }, kind === "ok" ? 1400 : 3200);
}
let QLAST = "vector";
function qtitles() {
  $("#qvec").title = "Importar editável: shape e texto nativos, soltos na comp aberta";
  $("#qras").title = "Importar como imagem: um PNG separado pra cada camada";
}
function qrender() {
  const can = QSEL.length && !qbusy, n = QSEL.length > 1 ? String(QSEL.length) : "";
  $("#qvec").disabled = !can; $("#qras").disabled = !can;
  $("#qn1").textContent = n; $("#qn2").textContent = n;
  $("#qdot").className = "aedot" + (AE.on ? " on" : "");
  $("#qdot").title = AE.on ? "After Effects conectado" : "After Effects desconectado";
}
function setQuick(on) {
  QUICK = on; document.body.classList.toggle("isquick", on);
  send({ type: "quickMode", on });
  if (on) { qstatus(""); qtitles(); qrender(); }
}
$("#qopen").onclick = () => setQuick(true);
$("#qclose").onclick = () => setQuick(false);
function qscale(v) { $("#qScale").value = v; $("#qq").textContent = v + "x"; try { localStorage.setItem("f2ae_qscale", v); } catch (e) {} }
try { const qs = localStorage.getItem("f2ae_qscale"); if (qs) qscale(qs); } catch (e) {}
$("#qq").onclick = () => qscale(+$("#qScale").value % 4 + 1);
function quickGo(mode) {
  if (!QSEL.length || qbusy) return;
  if (!AE.on) { qstatus("Abra o After Effects", "err"); return; }
  QLAST = mode; qbusy = true; qrender(); qstatus(mode === "raster" ? "Rasterizando…" : "Exportando…", "busy");
  send({ type: "quickExport", mode, options: { rasterScale: +$("#qScale").value, heavyRaster: $("#oHeavy").checked, splitLines: false } });
}
$("#qvec").onclick = () => quickGo("vector");
$("#qras").onclick = () => quickGo("raster");
async function quickSend(m) {
  const files = [{ path: "figma2ae.json", bytes: new TextEncoder().encode(m.manifest) }].concat(m.files);
  try {
    qstatus("Mandando pro After…", "busy");
    const r = await fetch(AE_URL + "/quick", { method: "POST", headers: { "Content-Type": "application/zip", "X-F2AE-Name": encodeURIComponent(m.name) }, body: makeZip(files) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "o After recusou");
    const n = j.layers || m.count;
    qstatus(`✓ ${n} camada${n > 1 ? "s" : ""} em ${j.comp}` + (j.place === "frame" ? " · mesma posição do Figma" : j.place === "center" ? " · centralizado" : "") + (j.notes && j.notes.length ? ` · ${j.notes.length} aviso${j.notes.length > 1 ? "s" : ""}` : ""), "ok");
    if (j.notes && j.notes.length) (QLAST === "raster" ? $("#qras") : $("#qvec")).title = j.notes.join("\n");
  } catch (e) {
    qstatus(/Failed to fetch|NetworkError/i.test(e.message) ? "Não achei o After Effects. Ele está aberto?" : "Erro: " + e.message, "err");
  } finally { qbusy = false; qrender(); }
}

function status(t, spin) { $("#status").innerHTML = (spin ? '<span class="spin"></span> ' : "") + esc(t); }
function setBusy(b) { busy = b; const n = checked().length; $("#exportar").disabled = b || !n; $("#salvar").disabled = b || !n; }

function render() {
  const m = $("#main");
  if (!TARGETS.length) {
    m.innerHTML = `<div class="empty"><div class="ico"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 2.5v15M14 2.5v15M2.5 6h15M2.5 14h15"/></svg></div>
      <h4>Nada selecionado</h4><p>Selecione no Figma o que quer levar pro After.</p>
      <div class="rules">
        <div><i>▢</i><span><b>Um frame</b> → um comp idêntico a ele</span></div>
        <div><i>▤</i><span><b>Vários frames</b> → um comp pra cada</span></div>
        <div><i>▦</i><span><b>A cena inteira</b> (frame ou Section com os frames) → um comp por frame</span></div>
        <div><i>◇</i><span><b>Objetos de um frame</b> → comp do tamanho do frame só com eles</span></div>
      </div></div>`;
    $("#exportar").textContent = "Enviar pro After Effects"; setBusy(busy); return;
  }
  const groups = []; const byG = {};
  TARGETS.forEach(t => { const g = t.group || ""; if (!byG[g]) { byG[g] = []; groups.push(g); } byG[g].push(t); });
  const nOn = checked().length;
  let h = `<div class="head"><b>${nOn} de ${TARGETS.length} comp${TARGETS.length > 1 ? "s" : ""}</b><span>marcado${nOn > 1 ? "s" : ""} pra ir pro After Effects</span></div>`;
  groups.forEach(g => {
    const list = byG[g], on = list.filter(t => !OFF.has(t.key)).length;
    const c0 = list.find(t => t.containerId);
    const frames = list.filter(t => t.mode === "frame");
    // com frame-contêiner junta pelo contêiner; sem ele (cena agrupada pelo nome) junta pelo grupo
    const cont = c0 ? c0 : (g && frames.length > 1 ? { containerId: "g:" + g, containerName: g, whole: frames.every(t => t.whole) } : null);
    if (g || list.length > 1 || cont) {
      h += `<div class="grph"><label><input type="checkbox" data-grp="${esc(g)}" ${on === list.length ? "checked" : ""} ${on && on < list.length ? 'data-mixed="1"' : ""}><span>${esc(g || "Seleção")} · ${list.length}</span></label>`;
      if (cont && cont.whole) h += `<button class="mini on" data-split="${esc(cont.containerId)}" title="Voltar a criar um comp pra cada frame de dentro">Separar em comps</button>`;
      else if (cont && list.length > 1) h += `<button class="mini" data-whole="${esc(cont.containerId)}" title="Os frames de “${esc(cont.containerName)}” viram UMA comp em 1920×1080, um depois do outro no tempo (não lado a lado)">Juntar em sequência</button>`;
      h += `</div>`;
    }
    list.forEach(t => {
      const off = OFF.has(t.key);
      h += `<div class="row ${off ? "off" : ""}"><label class="ck"><input type="checkbox" data-key="${esc(t.key)}" ${off ? "" : "checked"}></label>
        <div class="th" data-peek="${esc(t.frameId)}" title="Mostrar no Figma" data-th="${esc(t.frameId)}" style="${thumbs[t.frameId] ? `background-image:url(${thumbs[t.frameId]})` : ""}"></div>
        <div class="nm"><b>${esc(t.compName)}</b><small>${esc(t.frameName)} · ${t.w}×${t.h}</small></div>
        <span class="tag ${t.mode}">${t.whole ? "em sequência" : t.mode === "frame" ? "frame inteiro" : t.count + " objeto" + (t.count > 1 ? "s" : "")}</span></div>`;
    });
  });
  m.innerHTML = h;
  m.querySelectorAll("[data-mixed]").forEach(x => x.indeterminate = true);
  $("#exportar").textContent = !nOn ? "Marque pelo menos um frame" : nOn === 1 ? "Enviar 1 comp pro After Effects" : `Enviar ${nOn} comps pro After Effects`;
  setBusy(busy);
}

function exportar(mode) {
  if (!TARGETS.length) return;
  MODE = mode;
  setBusy(true); status("Exportando…", true);
  send({ type: "export", include: checked().map(t => t.key), whole: [...WHOLE], options: { reference: $("#oRef").checked, includeBg: $("#oBg").checked, continuity: $("#oCont").checked, rasterScale: +$("#oScale").value, heavyRaster: $("#oHeavy").checked, splitLines: $("#oLines").checked } });
}
$("#main").addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.key !== undefined) { if (t.checked) OFF.delete(t.dataset.key); else OFF.add(t.dataset.key); render(); }
  else if (t.dataset.grp !== undefined) { TARGETS.filter(x => (x.group || "") === t.dataset.grp).forEach(x => t.checked ? OFF.delete(x.key) : OFF.add(x.key)); render(); }
});
$("#main").addEventListener("click", e => {
  const t = e.target.closest("[data-peek],[data-whole],[data-split]"); if (!t) return;
  if (t.dataset.peek) send({ type: "peek", nodeId: t.dataset.peek });
  else if (t.dataset.whole) { WHOLE.add(t.dataset.whole); send({ type: "setWhole", whole: [...WHOLE] }); }
  else if (t.dataset.split) { WHOLE.delete(t.dataset.split); send({ type: "setWhole", whole: [...WHOLE] }); }
});
$("#exportar").onclick = () => exportar("send");
$("#salvar").onclick = () => exportar("save");

const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files) {
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const now = new Date(), dt = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF, dd = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;
  files.forEach(f => {
    const name = enc.encode(f.path), data = f.bytes, crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, dt, true); h.setUint16(12, dd, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true);
    h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
    parts.push(new Uint8Array(h.buffer), name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, dt, true); c.setUint16(14, dd, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
    c.setUint16(28, name.length, true); c.setUint16(30, 0, true); c.setUint16(32, 0, true); c.setUint16(34, 0, true); c.setUint16(36, 0, true); c.setUint32(38, 0, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), name);
    off += 30 + name.length + data.length;
  });
  const csize = central.reduce((a, p) => a + p.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csize, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: "application/zip" });
}

function warningsOf(pkg) {
  const w = [];
  (pkg.comps || []).forEach(s => (function walk(list) { (list || []).forEach(l => {
    if (l.reason) w.push(`${s.compName} · ${l.name}: virou imagem (${l.reason})`);
    (l.notes || []).forEach(n => w.push(`${s.compName} · ${l.name}: ${n}`));
    walk(l.children);
  }); })(s.layers));
  return w;
}

onmessage = ev => {
  const m = ev.data.pluginMessage; if (!m) return;
  if (m.type === "progress") { status(m.text, true); if (QUICK && qbusy) qstatus(m.text, "busy"); }
  else if (m.type === "startQuick") { if (!QUICK) setQuick(true); }
  else if (m.type === "quickExported") quickSend(m);
  else if (m.type === "selection") {
    QSEL = m.quick || []; if (QUICK) qrender();
    TARGETS = m.targets || [];
    if (!busy) status(m.error ? "Erro ao ler a seleção: " + m.error : "");
    render();
  }
  else if (m.type === "thumb") {
    const url = URL.createObjectURL(new Blob([m.bytes], { type: "image/png" }));
    thumbs[m.nodeId] = url;
    document.querySelectorAll(`[data-th="${CSS.escape(m.nodeId)}"]`).forEach(d => d.style.backgroundImage = `url(${url})`);
  }
  else if (m.type === "exported") {
    const files = [{ path: "figma2ae.json", bytes: new TextEncoder().encode(m.manifest) }].concat(m.files);
    const blob = makeZip(files);
    let pkg = null; try { pkg = JSON.parse(m.manifest); } catch (e) {}
    const nc = pkg ? pkg.comps.length : 0;
    const w = pkg ? warningsOf(pkg) : [];
    const save = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = m.name + ".f2ae.zip"; document.body.appendChild(a); a.click(); a.remove(); };
    const done = (title, text) => {
      setBusy(false);
      const d = document.createElement("div"); d.className = "modal" + (w.length ? " warn" : "");
      d.innerHTML = `<div><h3>${title}</h3><p class="hint" style="font-size:12px">${text}</p>
        ${w.length ? `<p style="margin:12px 0 4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600">Avisos (${w.length}):</p><ul>${w.slice(0, 30).map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p class="hint" style="font-size:12px;margin-top:10px">Tudo saiu como camada nativa editável.</p>`}
        <div style="text-align:right;margin-top:12px"><button class="btn primary" style="flex:none" id="ok">Ok</button></div></div>`;
      document.body.appendChild(d); d.querySelector("#ok").onclick = () => d.remove();
      if (!w.length) setTimeout(() => d.remove(), 2600);
    };
    if (MODE === "send") {
      status("Enviando pro After Effects…", true);
      fetch(AE_URL + "/package", { method: "POST", headers: { "Content-Type": "application/zip", "X-F2AE-Name": encodeURIComponent(m.name) }, body: blob })
        .then(r => r.json())
        .then(j => {
          if (!j.ok) throw new Error(j.error || "o painel recusou o pacote");
          status(`Enviado: ${nc} comp${nc > 1 ? "s" : ""}, ${m.count} camadas.`);
          done(j.route === "studio" ? "Enviado pro Figma2AE Studio" : "Enviado pro After Effects", j.route === "studio" ? "O <b>Figma2AE Studio</b> abriu com as telas: confira as tomadas e clique em <b>Montar no After Effects</b>." : j.auto ? "O After Effects está em modo automático: os comps já estão sendo criados." : "O painel <b>Figma2AE</b> abriu no After Effects: confira os comps e clique em <b>Importar</b>.");
        })
        .catch(e => {
          status("Não consegui enviar: " + e.message); setBusy(false);
          const d = document.createElement("div"); d.className = "modal err";
          d.innerHTML = `<div><h3>Não consegui falar com o After Effects</h3><p class="hint" style="font-size:12px">Confira se o After Effects está aberto. Se acabou de instalar ou atualizar a extensão, feche e abra o After Effects uma vez. Detalhe: ${esc(e.message)}</p>
            <div style="text-align:right;margin-top:12px;display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="sv">Salvar .zip</button><button class="btn primary" style="flex:none" id="ok">Fechar</button></div></div>`;
          document.body.appendChild(d); d.querySelector("#ok").onclick = () => d.remove(); d.querySelector("#sv").onclick = () => { save(); d.remove(); };
        });
    } else {
      save();
      status(`Pacote salvo: ${nc} comp${nc > 1 ? "s" : ""}, ${m.count} camadas.`);
      done("Pacote salvo", `Salve <b>${esc(m.name)}.f2ae.zip</b>. No After Effects, no painel <b>Figma2AE</b>, clique em <b>Abrir pacote…</b>.`);
    }
  }
  else if (m.type === "error") { setBusy(false); status("Erro: " + m.text); if (qbusy) { qbusy = false; qrender(); qstatus("Erro: " + m.text, "err"); } }
};

(() => { const rz = $("#rz"); let st = null, pend = null, raf = 0;
  const flush = () => { raf = 0; if (pend) { send({ type: "resize", w: pend.w, h: pend.h, quick: QUICK }); pend = null; } };
  rz.onpointerdown = e => { e.preventDefault(); st = { x: e.screenX, y: e.screenY, w: window.innerWidth, h: window.innerHeight }; rz.setPointerCapture(e.pointerId); document.body.classList.add("resizing"); };
  rz.onpointermove = e => { if (!st) return;
    pend = { w: Math.round(st.w + e.screenX - st.x), h: Math.round(st.h + e.screenY - st.y) };
    if (!raf) raf = requestAnimationFrame(flush); };
  const end = e => { if (!st) return; st = null; document.body.classList.remove("resizing"); flush(); try { rz.releasePointerCapture(e.pointerId); } catch (_) {} };
  rz.onpointerup = end; rz.onpointercancel = end; rz.onlostpointercapture = () => { st = null; document.body.classList.remove("resizing"); };
})();
render();
send({ type: "refreshSelection" });
pingAE();
</script>
<script>
/* campo numérico com setinhas próprias (as nativas do Chromium ficam feias no tema escuro) */
(function () {
  var UP = '<svg viewBox="0 0 8 5"><path d="M1 4l3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var DN = '<svg viewBox="0 0 8 5"><path d="M1 1l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function step(inp, dir) {
    try { dir > 0 ? inp.stepUp() : inp.stepDown(); } catch (e) { var s = parseFloat(inp.step) || 1; inp.value = Math.round(((parseFloat(inp.value) || 0) + dir * s) * 1000) / 1000; }
    inp.dispatchEvent(new Event("input", { bubbles: true })); inp.dispatchEvent(new Event("change", { bubbles: true }));
  }
  function wrap(inp) {
    if (inp.__f2 || !inp.parentNode) return; inp.__f2 = 1;
    var w = document.createElement("span"); w.className = "f2num";
    inp.parentNode.insertBefore(w, inp); w.appendChild(inp);
    var s = document.createElement("span"); s.className = "stp";
    s.innerHTML = '<button type="button" tabindex="-1" aria-label="Aumentar">' + UP + '</button><button type="button" tabindex="-1" aria-label="Diminuir">' + DN + '</button>';
    w.appendChild(s);
    var bs = s.querySelectorAll("button"), t = null;
    [[bs[0], 1], [bs[1], -1]].forEach(function (p) {
      p[0].addEventListener("mousedown", function (ev) { ev.preventDefault(); step(inp, p[1]); var n = 0; t = setInterval(function () { if (++n > 4) step(inp, p[1]); }, 80); });
    });
    var stop = function () { clearInterval(t); }; document.addEventListener("mouseup", stop); s.addEventListener("mouseleave", stop);
  }
  function scan(root) { (root.querySelectorAll ? root.querySelectorAll("input[type=number]") : []).forEach(wrap); }
  function boot() { scan(document); new MutationObserver(function (ms) { ms.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) { if (n.matches && n.matches("input[type=number]")) wrap(n); else scan(n); } }); }); }).observe(document.body, { childList: true, subtree: true }); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
